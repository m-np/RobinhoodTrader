{% extends "base.html" %}
{% block title %}Watchlist — Agentic trader{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Watchlist</h1>
  <button class="btn" onclick="showAddWatchModal()">+ Add ticker</button>
</div>

<div class="inline-form" id="add-watch-form" style="display:none">
  <input type="text" id="new-ticker" placeholder="Ticker (e.g. AAPL)" maxlength="10">
  <input type="text" id="new-notes" placeholder="Notes (optional)">
  <button class="btn-primary" onclick="addToWatchlist()">Add</button>
  <button class="btn" onclick="document.getElementById('add-watch-form').style.display='none'">Cancel</button>
</div>

<div class="card" id="watchlist-table">
  <table class="data-table">
    <thead>
      <tr>
        <th>Ticker</th>
        <th>Notes</th>
        <th>Added</th>
        <th>Latest price</th>
        <th>Today's change</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="watchlist-tbody">
      <tr><td colspan="6" style="color:var(--text-3);text-align:center;padding:20px">Loading...</td></tr>
    </tbody>
  </table>
</div>
{% endblock %}
