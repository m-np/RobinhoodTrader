{% extends "base.html" %}
{% block title %}Watchlist — Agentic trader{% endblock %}

{% block content %}
<div class="connect-banner" id="connect-banner" style="display:none">
  <span>🔌 Robinhood not connected — live prices unavailable.</span>
  <a href="/auth/robinhood" class="btn-sm">Connect Robinhood</a>
</div>

<div class="page-header">
  <div>
    <h1 class="page-title">Watchlist</h1>
    <p class="page-sub" id="watchlist-status">Prices update every 30 seconds.</p>
  </div>
  <button class="btn" onclick="showAddWatch()">+ Add ticker</button>
</div>

<!-- Search-by-company/ticker form -->
<div id="watch-search-wrap" class="ticker-search-wrap" style="display:none;margin-bottom:16px">
  <input type="text" id="watch-search-input" placeholder="Search company or ticker…" oninput="onTickerSearch(this.value,'watch')" autocomplete="off" style="width:100%">
  <div class="search-dropdown" id="watch-search-dropdown"></div>
  <div style="display:flex;gap:8px;margin-top:8px">
    <input type="text" id="watch-notes" placeholder="Notes (optional)" style="flex:1">
    <button class="btn" onclick="showAddWatch()">Cancel</button>
  </div>
</div>

<div class="card" id="watchlist-table">
  <table class="data-table">
    <thead>
      <tr>
        <th>Ticker</th>
        <th>Notes</th>
        <th>Added</th>
        <th>Latest price</th>
        <th>Today's change</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="watchlist-tbody">
      <tr><td colspan="6" style="color:var(--text-3);text-align:center;padding:20px">Loading...</td></tr>
    </tbody>
  </table>
</div>
{% endblock %}
